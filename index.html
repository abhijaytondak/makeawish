  <body class="min-h-dvh w-full">
    <div id="root" class="min-h-dvh w-full"></div>

    <script type="text/babel" data-presets="env,react">
      const { useState, useMemo, useEffect } = React;

      /* ---------- DATA ----------
         Each wish carries its own copy of these activities. Tapping one
         redirects to that product's existing in-app flow (not built here).
         A wish is complete only when ALL of its activities are done. */
      // UPI is a daily challenge: 3 payments = 1 day, up to 30 days (90 payments).
      const UPI_PER_DAY = 3;
      const UPI_MAX_DAYS = 30;
      const UPI_MAX_PAYMENTS = UPI_PER_DAY * UPI_MAX_DAYS; // 90

      const PRODUCTS = [
        {
          id: "upi",
          name: "Daily UPI Challenge",
          short: "UPI",
          tagline: "Complete 3 UPI payments today to move closer to win",
          icon: "spark",
          journeyTitle: "UPI payment",
          imgWebp: "task_upi.webp",
          imgJpg: "task_upi.jpg",
          target: UPI_PER_DAY, // 3 payments = today's goal (1 day); 30 days max
          points: 50, // up to 50% of the Wish Journey Score, earned over 30 days
        },
        {
          id: "card",
          name: "Get Your Level Up Card",
          short: "Level Up Card",
          tagline: "Apply for your Level Up Card",
          icon: "card",
          journeyTitle: "Card application",
          imgWebp: "task_card.webp",
          imgJpg: "task_card.jpg",
          supportsInProgress: true,
          points: 25, // +25% when the Level Up Card is applied
        },
        {
          id: "refer",
          name: "Invite a Friend",
          short: "Refer & Earn",
          tagline: "Refer SalarySe to a friend",
          icon: "gift",
          journeyTitle: "Refer & Earn",
          imgWebp: "task_refer.webp",
          imgJpg: "task_refer.jpg",
          supportsInProgress: true,
          points: 15, // +15% when a referral is completed
        },
      ];

      /* ---------- WISH MODEL ----------
         One wish per user. The Wish Journey Score starts at 9% and grows as
         activities complete:
           upi   — 0..UPI_MAX_PAYMENTS counter (3 payments = 1 day, up to 30 days → +50%)
           card  — "idle" | "in-progress" | "success" (+25% when applied)
           refer — "idle" | "in-progress" | "success" (+15% when completed)
         A wish is "entered in the draw" once Card AND Referral are done. */
      const MAX_WISHES = 1; // single-wish campaign — one wish per user

      // Wish Journey Score weights — 9 + 25 + 15 + 50 = 99% max (intentionally never 100).
      const START_SCORE = 9;
      const CARD_POINTS = 25;
      const REFER_POINTS = 15;
      const UPI_POINTS = 50;

      const freshTasks = () => ({ upi: 0, card: "idle", refer: "idle" });

      // Normalised per-activity state for display/badges.
      function taskState(productId, tasks) {
        if (productId === "upi") {
          return tasks.upi >= UPI_MAX_PAYMENTS ? "success" : tasks.upi > 0 ? "in-progress" : "idle";
        }
        return tasks[productId] || "idle";
      }
      const taskDone = (productId, tasks) => taskState(productId, tasks) === "success";

      // UPI daily-challenge derived values.
      const upiDays = (tasks) => Math.floor((tasks.upi || 0) / UPI_PER_DAY);   // 0..30 completed days
      const upiToday = (tasks) => (tasks.upi || 0) % UPI_PER_DAY;              // 0..2 payments toward today
      const upiScore = (tasks) =>
        (Math.min(tasks.upi || 0, UPI_MAX_PAYMENTS) / UPI_MAX_PAYMENTS) * UPI_POINTS;

      // Wish Journey Score = 9 + (card?25) + (refer?15) + (UPI days/30)×49, rounded. Max 98.
      const wishScore = (w) =>
        !w
          ? START_SCORE
          : Math.round(
              START_SCORE +
                (taskDone("card", w.tasks) ? CARD_POINTS : 0) +
                (taskDone("refer", w.tasks) ? REFER_POINTS : 0) +
                upiScore(w.tasks)
            );

      // "Entered in the draw" = the two one-time milestones are done (UPI keeps boosting the score after).
      const wishComplete = (w) => !!w && taskDone("card", w.tasks) && taskDone("refer", w.tasks);

      // Advance one activity after its (simulated) redirect returns.
      function advanceTask(tasks, productId) {
        if (productId === "upi") {
          return { ...tasks, upi: Math.min(tasks.upi + 1, UPI_MAX_PAYMENTS) };
        }
        const cur = tasks[productId];
        const product = PRODUCTS.find((p) => p.id === productId);
        let next;
        if (product && product.supportsInProgress) next = cur === "idle" ? "in-progress" : "success";
        else next = "success";
        return { ...tasks, [productId]: next };
      }

      // State semantics:
      //   idle        — not started
      //   in-progress — Card / Refer mid-flow, or UPI with 1–2 of 3 txns done
      //   success     — activity complete
      //   failed      — retry possible
      const STATE_META = {
        "in-progress": {
          label: "In progress",
          icon: "flame",
          fg: "#F4C674",
          bg: "rgba(244,198,116,0.12)",
          border: "rgba(244,198,116,0.4)",
        },
        success: {
          label: "Completed",
          icon: "check",
          fg: "#7CE3A8",
          bg: "rgba(124,227,168,0.12)",
          border: "rgba(124,227,168,0.4)",
        },
        failed: {
          label: "Failed — retry",
          icon: "back",
          fg: "#F49191",
          bg: "rgba(244,145,145,0.1)",
          border: "rgba(244,145,145,0.4)",
        },
      };

      const WISH_PRESETS = ["A new iPhone", "Solo trip to Goa", "Nike Air Jordan", "Save ₹50,000"];

      /* ---------- WISH WALL — FULL TERMS & CONDITIONS (legal draft; to be finalised with Legal + product) ---------- */
      const WISH_TERMS_UPDATED = "16 June 2026";
      const WISH_TERMS = [
        {
          h: "1. Overview",
          p: [
            "The SalarySe Wish Wall is an engagement campaign that allows eligible users to submit a personal wish and participate in a draw for wish fulfillment by completing qualifying SalarySe activities.",

          ],
        },
        {
          h: "2. Eligibility",
          p: ["To participate, users must:"],
          ul: [
            "Be 18 years of age or older.",
            "Have an active SalarySe account.",
            "Be part of an organization where the Wish Wall campaign is being conducted.",
            "Complete at least one qualifying SalarySe activity during the campaign period.",
          ],
          after: ["SalarySe reserves the right to verify participant eligibility at any stage of the campaign."],
        },
        {

          p: [
            "To participate in the Wish Wall campaign:",
            "Step 1 — Submit a wish through the Wish Wall feature available within the SalarySe application.",
            "Step 2 — Complete at least one qualifying activity, including but not limited to:",
          ],
          ul: [
            "UPI Transaction",
            "Level Up Card Application",
            "Successful Referral",
            "Any other activity communicated by SalarySe during the campaign period",
          ],
          after: ["Only users who complete a qualifying activity will be considered eligible for winner selection."],
        },
        {

          p: [

          ],
        },
        {
          h: "5. Wish Submission Guidelines",
          p: [
            "Participants are encouraged to submit genuine wishes aligned with their personal goals and aspirations.",
            "SalarySe reserves the right to reject, remove, or disqualify wishes that:",
          ],
          ul: [
            "Contain offensive, inappropriate, or unlawful content.",
            "Violate intellectual property rights.",
            "Promote harmful or prohibited activities.",
            "Are deemed unsuitable for the campaign.",
          ],
        },
        {
          h: "6. Winner Selection",
          p: [
            "Winners will be selected from eligible participants at SalarySe's sole discretion in accordance with campaign rules.",
            "Completion of a qualifying activity does not guarantee selection as a winner.",
            "SalarySe's decision regarding winner selection shall be final and binding.",
          ],
        },
        {
          h: "7. Reward Fulfillment",
          p: ["Selected winners may be required to:"],
          ul: [
            "Verify their identity.",
            "Provide supporting information regarding the submitted wish.",
            "Comply with any additional verification requirements requested by SalarySe.",
          ],
          after: [
            "SalarySe reserves the right to determine the manner, value, and method of wish fulfillment.",
            "Where required, SalarySe may provide an equivalent alternative reward of comparable value.",
            "Rewards are non-transferable and cannot be exchanged for cash unless explicitly approved by SalarySe.",
          ],
        },
        {
          h: "8. Disqualification",
          p: ["SalarySe reserves the right to disqualify any participant found to be:"],
          ul: [
            "Providing false information.",
            "Creating multiple accounts.",
            "Attempting to manipulate campaign outcomes.",
            "Engaging in fraudulent, suspicious, or abusive activity.",
          ],
        },
        {
          h: "9. Publicity & Communication",
          p: [
            "By participating in the campaign, winners may be requested to participate in reasonable promotional activities related to the campaign.",
            "SalarySe may publish winner names, photographs, wish stories, testimonials, or campaign experiences across its communication channels, subject to applicable laws and required consent.",
          ],
        },
        {
          h: "10. Changes to the Campaign",
          p: ["SalarySe reserves the right to modify, suspend, extend, or discontinue the campaign at any time without prior notice where required for operational, technical, legal, or business reasons."],
        },
        {
          h: "11. Limitation of Liability",
          p: ["SalarySe shall not be responsible for:"],
          ul: [
            "Technical failures or system interruptions.",
            "Delayed, lost, or incomplete submissions.",
            "Events beyond its reasonable control that affect campaign execution.",
          ],
        },
        {
          h: "12. Final Decision",
          p: ["All decisions made by SalarySe relating to eligibility, participation, winner selection, verification, and reward fulfillment shall be final."],
        },
        {
          h: "13. Contact Us",
          p: [
            "For questions regarding the Wish Wall campaign, please contact:",
            "support@salaryse.com",
            'Subject Line: "Wish Wall Support"',
          ],
        },
      ];

      /* ---------- ICONS ---------- */
      const Icon = ({ name, className = "w-6 h-6", stroke = "currentColor", style }) => {
        const props = {
          className, style, viewBox: "0 0 24 24", fill: "none", stroke,
          strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round",
        };
        switch (name) {
          case "card":
            return (
              <svg {...props}>
                <rect x="2.5" y="5.5" width="19" height="13" rx="3" />
                <path d="M2.5 10h19" />
                <path d="M6 15h4" />
              </svg>
            );
          case "spark":
            return (
              <svg {...props}>
                <path d="M12 3v4M12 17v4M3 12h4M17 12h4" />
                <path d="M6.4 6.4l2.8 2.8M14.8 14.8l2.8 2.8M6.4 17.6l2.8-2.8M14.8 9.2l2.8-2.8" />
              </svg>
            );
          case "gift":
            return (
              <svg {...props}>
                <rect x="3" y="9" width="18" height="11" rx="2" />
                <path d="M3 13h18M12 9v11" />
                <path d="M8 9c0-2 1.5-3 3-3 1.5 0 1.5 3 1.5 3M16 9c0-2-1.5-3-3-3-1.5 0-1.5 3-1.5 3" />
              </svg>
            );
          case "back": return <svg {...props}><path d="M15 6l-6 6 6 6" /></svg>;
          case "check": return <svg {...props}><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>;

              </svg>
            );
          case "edit":
            return (

                <path d="M4 20h4l10-10-4-4L4 16v4z" />

            );
          case "arrow": return <svg {...props}><path d="M5 12h14M13 6l6 6-6 6" /></svg>;
          case "home":
            return (
              <svg {...props}>
                <path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1v-9z" />
              </svg>
            );
          case "wish":
            return (
              <svg {...props}>
                <path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z" />

          case "sparkle":

                      className="h-full rounded-full fill transition-all duration-500"
                      style={{ width: `${progressPct}%` }}
                    />
                  </div>
                  <p className="mt-3 text-[12px] leading-snug text-ink-soft">
                    {thisWishComplete ? (
                      <>
                        <span className="text-hl font-bold">Your wish is locked in.</span> You're entered into the draw. ✨
                      </>
                    ) : (
                      <>
                        Every eligible activity boosts your chances in the{" "}
                        <span className="text-hl font-bold">wish fulfilment draw</span>.
                      </>
                    )}
                  </p>
                </div>
              </div>

              <div className="px-5 mt-6 flex-1 flex flex-col">
                {/* Section header — directional, action-oriented */}
                <div className="mb-1">
                  <h2 className="text-[22px] font-black tracking-tight text-ink leading-[1.18]">
                    Ways to Move <span className="text-hl">Closer to Your Wish</span>
                  </h2>
                  <p className="mt-1 text-[13px] text-ink-soft leading-snug">
                    Complete more activities to <span className="text-hl font-semibold">increase your odds.</span>
                  </p>
                </div>

                {/* This-wish activity progress */}
                <div className="mb-4 mt-3 flex items-center gap-2 text-[11px] font-semibold text-ink-mute uppercase tracking-[0.1em]">
                  <Icon name={thisWishComplete ? "check" : "sparkle"} className="w-3.5 h-3.5" stroke={thisWishComplete ? "#7CE3A8" : "#F4CC60"} />
                  Your tasks
                </div>

                {/* 3 activity choices for the active wish */}
                <div className="space-y-4">
                  {PRODUCTS.map((p) => (
                    <TaskChoiceCard
                      key={p.id}
                      p={p}
                      tasks={activeTasks}
                      onPick={() => onPickTask(p.id)}
                    />
                  ))}
                </div>

                {/* Compliance — how-it-works + T&Cs (present on every page) */}
                <button
                  type="button"
                  onClick={() => setRulesOpen(true)}
                  className="mt-7 w-full text-center text-[11px] text-ink-mute hover:text-hl underline underline-offset-2 decoration-ink-mute/40 hover:decoration-hl/60 transition"
                >
                  How it works · Terms &amp; conditions
                </button>

              </div>
            </div>

            <DrawRulesSheet open={rulesOpen} onClose={() => setRulesOpen(false)} />

          </div>
        );
      }

      /* ---------- WISH CAROUSEL (active + past wishes) ---------- */
      function WishCarousel({ items, onSelect }) {
        const total = items.length;
        const single = total === 1;
        const [active, setActive] = useState(0);
        const trackRef = React.useRef(null);

        const onScroll = () => {
          const el = trackRef.current;
          if (!el) return;
          const cardWidth = el.firstChild?.offsetWidth || 1;
          const gap = 12; // px gap-3
          const i = Math.round(el.scrollLeft / (cardWidth + gap));
          setActive(Math.max(0, Math.min(items.length - 1, i)));
        };

        // Keep the carousel aligned to the active wish (on mount + when it changes).
        const activeItemIndex = Math.max(0, items.findIndex((it) => it.active));
        useEffect(() => {
          setActive(activeItemIndex);
          const el = trackRef.current;
          if (!el || !el.firstChild) return;
          el.scrollTo({ left: activeItemIndex * (el.firstChild.offsetWidth + 12), behavior: "auto" });
        }, [activeItemIndex, total]);

        return (
          <div className="relative">
            <div
              ref={single ? null : trackRef}
              onScroll={single ? undefined : onScroll}
              className={cls(
                // py-3 gives the gold glow vertical room before the overflow-x clip kicks in
                "flex gap-3 px-5 py-3",
                single ? "" : "overflow-x-auto no-scrollbar snap-x snap-mandatory"
              )}
            >
              {items.map((it, i) => {
                const isActive = it.active;
                const isComplete = it.complete;
                return (
                  <div
                    key={i}
                    onClick={() => onSelect && !isActive && onSelect(i)}
                    className={cls(
                      "hero-emerald text-white brand-glow overflow-hidden relative shadow-card rounded-[26px] inner-rim p-5",
                      single ? "w-full" : "snap-center shrink-0 w-[88%]",
                      isActive ? "border border-hl/55 shadow-gold" : "border border-hl/15",
                      onSelect && !isActive && "cursor-pointer"
                    )}
                  >
                    <Icon name="star4" className="sparkle-deco w-3 h-3 animate-twinkle" stroke="#F4CC60"
                      style={{ top: 14, right: 22, animationDelay: `${i * 200}ms` }} />
                    <Icon name="star4" className="sparkle-deco w-2.5 h-2.5 animate-twinkle" stroke="#FBE38C"
                      style={{ bottom: 22, right: 60, animationDelay: `${i * 200 + 400}ms` }} />

                    <div className="text-[10px] uppercase tracking-[0.22em] text-hl font-bold flex items-center gap-2 pr-10">
                      <Icon name="sparkle" className="w-3.5 h-3.5" stroke="#F4CC60" />
                      My wish
                    </div>

                    <div className="mt-3 text-[24px] leading-[1.18] font-extrabold text-white break-words line-clamp-2 min-h-[58px] pr-10">
                      "{it.text}"
                    </div>

                    <div className="mt-4 flex items-center gap-2 flex-wrap">
                      {isComplete ? (
                        <span className="text-[10px] text-white/65 font-semibold uppercase tracking-wider">completed · entered in draw</span>
                      ) : (
                        <span className="text-[10px] text-white/65 font-semibold uppercase tracking-wider">in progress</span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Dot indicator */}
            {total > 1 && (
              <div className="mt-2 flex items-center justify-center gap-1.5">
                {items.map((_, i) => (
                  <span
                    key={i}
                    className={cls(
                      "h-1.5 rounded-full transition-all",
                      i === active ? "w-5 bg-hl" : "w-1.5 bg-line"
                    )}
                  />
                ))}
                <span className="ml-2 text-[10px] text-ink-mute font-semibold">
                  {active === activeItemIndex ? "current wish" : `wish ${active + 1}/${total}`}
                </span>
              </div>
            )}
          </div>
        );
      }

      /* Task choice card — image-led banner with state overlays */
      function TaskChoiceCard({ p, tasks, onPick }) {
        const state = taskState(p.id, tasks);
        const isLocked = state === "success";
        const isFailed = state === "failed";
        const isInProgress = state === "in-progress";
        const isUpi = p.id === "upi";
        const upiDayCount = isUpi ? upiDays(tasks) : 0;     // completed days (0..30)
        const upiTodayCount = isUpi ? upiToday(tasks) : 0;  // payments toward today (0..2)

        const ringAccent =
          state === "success" ? "ring-2 ring-[rgba(124,227,168,0.5)] shadow-[0_0_24px_rgba(124,227,168,0.18)]" :
          state === "in-progress" ? "ring-2 ring-[rgba(244,198,116,0.45)] shadow-[0_0_22px_rgba(244,198,116,0.16)]" :
          state === "failed" ? "ring-2 ring-[rgba(244,145,145,0.45)]" :
          "ring-1 ring-white/5";

        const ctaText =
          state === "success" ? "Completed" :
          state === "in-progress" ? "Continue" :
          state === "failed" ? "Try again" : "Continue";

        const statusDetail = isLocked
          ? (isUpi ? `${UPI_MAX_DAYS}/${UPI_MAX_DAYS} days · challenge complete` : "Activity completed")
          : isInProgress
          ? (isUpi ? `${upiDayCount}/${UPI_MAX_DAYS} days · ${upiTodayCount}/${UPI_PER_DAY} payments today`
            : p.id === "card" ? "Application under review · ~24 hrs"
            : p.id === "refer" ? "Waiting for friend to sign up"
            : "In progress")
          : isFailed
          ? (p.id === "card" ? "KYC didn’t go through. Try again."
            : "Try again.")
          : null;

        const showOverlayBadge = state !== "idle";

        return (
          <div className="space-y-2">
            {/* Optional STATE strip above the image — pristine art stays untouched */}
            {showOverlayBadge && (
              <div className="flex items-center justify-between px-1">
                <StateBadge state={state} />
                {isUpi && !isLocked && (
                  <span className="text-[10px] font-extrabold tabular-nums text-hl tracking-[0.08em]">
                    {upiDayCount}/{UPI_MAX_DAYS} days
                  </span>
                )}
              </div>
            )}

            <button
              onClick={onPick}
              disabled={isLocked}
              aria-label={`${p.name} — ${ctaText}`}
              className={cls(
                "w-full text-left relative block rounded-[26px] overflow-hidden transition-all shadow-card",
                !isLocked && "active:translate-y-0.5 active:scale-[0.99] hover:brightness-[1.06] hover:shadow-[0_12px_40px_rgba(124,58,237,0.22)]",
                ringAccent
              )}
              style={{ aspectRatio: "686 / 174", background: "linear-gradient(135deg, #5B2EAA 0%, #2C0F5C 100%)" }}
            >
              <picture>
                <source srcSet={p.imgWebp} type="image/webp" />
                <source srcSet={p.imgJpg} type="image/jpeg" />
                <img
                  src={p.imgJpg}
                  alt={`${p.name} — ${p.tagline}`}
                  width={686}
                  height={174}
                  decoding="async"
                  className="absolute inset-0 w-full h-full object-cover select-none"
                  draggable="false"
                />
              </picture>

              {isFailed && (
                <div className="absolute inset-0 pointer-events-none"
                  style={{ background: "rgba(244,145,145,0.06)" }} />
              )}
              {isLocked && (
                <div className="absolute inset-0 pointer-events-none"
                  style={{ background: "rgba(124,227,168,0.05)" }} />
              )}

            </button>

            {/* Status detail row — outside the image, full width */}
            {statusDetail && (
              <div
                className={cls(
                  "rounded-xl px-3 py-2 text-[11px] flex items-center gap-2 mx-1",
                  isInProgress ? "bg-[rgba(244,198,116,0.10)] border border-[rgba(244,198,116,0.30)] text-[#F4C674]" :
                  isFailed ? "bg-[rgba(244,145,145,0.08)] border border-[rgba(244,145,145,0.30)] text-[#F49191]" :
                  isLocked ? "bg-[rgba(124,227,168,0.10)] border border-[rgba(124,227,168,0.30)] text-[#7CE3A8]" :
                  ""
                )}
              >
                {isInProgress && (
                  <span className="h-1.5 w-1.5 rounded-full bg-[#F4C674] animate-pulse shrink-0" />
                )}
                {isLocked && (
                  <Icon name="check" className="w-3.5 h-3.5 shrink-0" stroke="#7CE3A8" />
                )}
                <span className="truncate font-semibold">{statusDetail}</span>
              </div>
            )}
            {!isLocked && (
              <p className="text-[10px] text-ink-mute italic mx-1 mt-1" style={{ fontFamily: "Fraunces, serif" }}>
                {isUpi
                  ? "demo: tap = 1 UPI payment (3 payments = 1 day, up to 30 days)"
                  : isInProgress
                  ? "demo: tap again to simulate completion"
                  : "demo: tap to start"}
              </p>
            )}
          </div>
        );
      }

      /* ---------- REDIRECT OVERLAY ---------- */
      function RedirectOverlay({ product, onDone }) {
        useEffect(() => {
          const t = setTimeout(onDone, 1600);
          return () => clearTimeout(t);
        }, [onDone]);

        return (
          <div className="absolute inset-0 z-50 bg-bg/95 backdrop-blur-sm grid place-items-center px-8 animate-slide">
            <div className="text-center max-w-[280px]">
              <div className="relative mx-auto h-20 w-20 rounded-3xl bg-hl text-brand-darker grid place-items-center shadow-gold animate-pop">
                <Icon name={product.icon} className="w-9 h-9" />
                <span className="absolute -bottom-2 left-1/2 -translate-x-1/2 h-7 w-7 rounded-full bg-brand border-2 border-bg grid place-items-center">
                  <Icon name="arrow" className="w-3.5 h-3.5" stroke="#F4CC60" />
                </span>
              </div>
              <div className="mt-6 text-[11px] uppercase tracking-[0.2em] font-bold text-hl">Redirecting</div>
              <h3 className="mt-1 text-[20px] font-black text-ink leading-tight">
                Continuing to {product.short}…
              </h3>
              <p className="mt-3 text-[13px] text-ink-soft">
                You'll finish the existing {product.short.toLowerCase()} flow. We'll bring you back to your wish.
              </p>
              <div className="mt-5 h-1 rounded-full bg-line overflow-hidden">
                <div className="h-full fill animate-shimmer" style={{ width: "100%" }} />
              </div>
            </div>
          </div>
        );
      }

      /* ---------- WISH JOURNEY — typography-led wow moment ---------- */
      /* ---------- PERSISTENCE ----------
         Wish Wall stays active post-event: all wishes + their activity progress
         are saved to localStorage so they survive refreshes and return visits. */
      const STORAGE_KEY = "salaryse_wishwall_v3";

      function loadSaved() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const d = JSON.parse(raw);
          return d && typeof d === "object" && Array.isArray(d.wishes) ? d : null;
        } catch (e) {
          return null;
        }
      }

      /* ---------- APP ---------- */
      function App() {
        // routes: entry → unlock → granted. Returning users with saved wishes
        // resume straight on the journey (unlock), not the entry screen.
        const saved = useMemo(loadSaved, []);

        // wishes: array of up to MAX_WISHES { text, tasks }. activeIdx is the
        // wish currently being worked on.
        const [wishes, setWishes] = useState(() => (saved && saved.wishes) || []);
        const [activeIdx, setActiveIdx] = useState(() => (saved && typeof saved.activeIdx === "number" ? saved.activeIdx : 0));
        const [route, setRoute] = useState(() => (saved && saved.wishes && saved.wishes.length ? "unlock" : "entry"));
        const [redirectingProductId, setRedirectingProductId] = useState(null);

        // Persist on every meaningful change.
        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ wishes, activeIdx }));
          } catch (e) { /* storage unavailable — non-fatal */ }
        }, [wishes, activeIdx]);

        const completedCount = useMemo(() => wishes.filter(wishComplete).length, [wishes]);
        const activeWish = wishes[activeIdx] || null;
        // Activities fully "done" (UPI only counts at 30 days) — used for light messaging.
        const activityDone = activeWish ? PRODUCTS.filter((p) => taskDone(p.id, activeWish.tasks)).length : 0;
        // Wish Journey Score: starts at 9%, max 99% (9 + card 25 + refer 15 + UPI up to 50).
        const progressPct = wishScore(activeWish);
        const canMakeMore = false; // one wish per user — no additional wishes

        const redirectingProduct = useMemo(
          () => redirectingProductId ? PRODUCTS.find((p) => p.id === redirectingProductId) : null,
          [redirectingProductId]
        );

        // Make the wish. It becomes the active wish and moves to the journey.
        function handleEntryConfirm(text) {
          const idx = wishes.length;
          setWishes([...wishes, { text, tasks: freshTasks() }]);
          setActiveIdx(idx);
          setRoute("unlock");
        }

        // Make another wish if slots remain, else return to activities.
        function handleMakeAnother() {
          if (canMakeMore) setRoute("entry");
          else setRoute("unlock");
        }

        // Tapping an activity triggers the redirect simulation.
        function handlePickTask(productId) {
          if (!activeWish || taskDone(productId, activeWish.tasks)) return;
          setRedirectingProductId(productId);
        }

        // After the simulated redirect returns, advance the activity. UPI needs
        // 3 taps; Card/Refer go idle → in-progress → success. Completing the
        // LAST activity completes the wish (+33%) and triggers the celebration.
        function handleRedirectDone() {
          const id = redirectingProductId;
          setRedirectingProductId(null);
          if (!id || !activeWish) return;
          const after = advanceTask(activeWish.tasks, id);
          const updatedWish = { ...activeWish, tasks: after };
          setWishes(wishes.map((w, i) => (i === activeIdx ? updatedWish : w)));
        }

        const completedWishes = useMemo(
          () => wishes.filter(wishComplete).map((w) => ({ text: w.text, score: wishScore(w) })),
          [wishes]
        );

        return (
          <div className="w-full min-h-dvh flex justify-center" style={{ background: "#0A0A0A" }}>
            <div className="phone">

              {route === "entry" && (
                <WishEntryScreen
                  onConfirm={handleEntryConfirm}
                  wishNumber={wishes.length + 1}
                  totalWishes={MAX_WISHES}
                  completedCount={completedCount}
                  wishHistory={completedWishes}
                />
              )}

              {route === "unlock" && (
                <UnlockTasksScreen
                  wishes={wishes}
                  activeIdx={activeIdx}
                  completedCount={completedCount}
                  progressPct={progressPct}
                  canMakeMore={canMakeMore}
                  onPickTask={handlePickTask}
                  onMakeAnother={handleMakeAnother}
                  onSelectWish={(i) => setActiveIdx(i)}
                />
              )}

              {/* Redirect overlay sits above any screen */}
              {redirectingProduct && (
                <RedirectOverlay
                  product={redirectingProduct}
                  onDone={handleRedirectDone}
                />
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
